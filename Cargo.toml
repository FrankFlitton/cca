[package]
name = "cca"
version = "0.1.0"
edition = "2024"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSColor", "NSColorSampler", "NSColorSpace", "block2", "objc2-core-foundation", "NSView", "NSResponder", "NSWindow", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "objc2-core-foundation"] }
raw-window-handle = "0.6"

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
